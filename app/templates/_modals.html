<dialog id="formDialog"><form id="recordForm" novalidate>
  <h2 id="formTitle"></h2><div id="formFields"></div>
  <p id="formError" class="form-error" role="alert" hidden></p>
  <div class="dialog-actions"><button type="button" id="cancelBtn" class="btn">Cancel</button><button type="submit" class="btn primary">Save</button></div>
</form></dialog>
<dialog id="confirmDialog"><h2>Confirm deletion</h2><p id="confirmText"></p>
  <div class="dialog-actions"><button type="button" id="confirmCancel" class="btn">Cancel</button><button type="button" id="confirmOk" class="btn danger">Delete</button></div></dialog>
