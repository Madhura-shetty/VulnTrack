<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf }}">
<title>Sign in - VulnTrack</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head><body class="login-body">
<main class="login-card">
  <h1>VulnTrack</h1>
  <p class="muted">Vulnerability and Security Data Management System</p>
  <form id="loginForm" novalidate>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" maxlength="50" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="200" required>
    <p id="loginError" class="form-error" role="alert" hidden></p>
    <button id="loginBtn" class="btn primary block" type="submit">Sign in</button>
  </form>
</main>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body></html>
